<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — SAIL</title>
  <link rel="stylesheet" href="css/admin.css" />
<script src="../js/theme.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>SAIL Admin Panel</h1>
      <p class="sub">Sign in to manage lab content.</p>
      <div class="error-msg" id="errorMsg" style="display:none;">Incorrect password. Please try again.</div>
      <form id="loginForm">
        <div class="field">
          <label for="password">Admin Password</label>
          <input type="password" id="password" placeholder="Enter password (e.g. sail2026)" required />
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Log In</button>
      </form>
      <p style="margin-top:16px;font-size:0.8rem;color:var(--color-muted);">
        <a href="../index.html">&larr; Back to website</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const result = await doLogin(password);
        if (result.success) {
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = result.error || 'Incorrect password. Please try again.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
