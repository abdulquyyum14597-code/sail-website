<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team — SAIL Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
<script src="../js/theme.js"></script>
</head>
<body data-page="team">
  <div class="admin-layout">
    <div data-include="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Team / Interns</h1>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-secondary" onclick="exportCollection('team')">Export JSON</button>
          <button class="btn btn-primary" onclick="openAddModal()">+ Add Member</button>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="teamTableBody">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2 id="modalTitle">Add Team Member</h2>
      <form id="teamForm">
        <input type="hidden" id="tId" />
        <div class="field">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" id="tName" required />
        </div>
        <div class="field">
          <label>Role <span class="required">*</span></label>
          <input type="text" id="tRole" required />
        </div>
        <div class="field">
          <label>Photo URL / Path</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="text" id="tPhoto" placeholder="assets/images/placeholder-person.jpg" style="flex:1;" />
            <label class="btn btn-secondary" style="margin:0;cursor:pointer;white-space:nowrap;padding:8px 12px;font-size:0.85rem;">
              Upload
              <input type="file" accept="image/*" style="display:none;" onchange="handleImageUpload(this, 'tPhoto')" />
            </label>
          </div>
        </div>
        <div class="field">
          <label>Short Bio</label>
          <textarea id="tBio" rows="3"></textarea>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="tEmail" />
        </div>
        <div class="field">
          <label>LinkedIn URL</label>
          <input type="text" id="tLinkedin" placeholder="https://linkedin.com/in/..." />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/include.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
