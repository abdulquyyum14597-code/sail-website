<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — SAIL Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
<script src="../js/theme.js"></script>
</head>
<body data-page="gallery">
  <div class="admin-layout">
    <div data-include="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Gallery</h1>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-secondary" onclick="exportCollection('gallery')">Export JSON</button>
          <button class="btn btn-primary" onclick="openAddModal()">+ Add Photo</button>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Preview</th>
            <th>Caption</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="galleryTableBody">
          <tr><td colspan="3">Loading...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2 id="modalTitle">Add Photo</h2>
      <form id="galleryForm">
        <input type="hidden" id="gId" />
        <div class="field">
          <label>Image URL / Path <span class="required">*</span></label>
          <input type="text" id="gImage" placeholder="assets/images/placeholder-lab.jpg" required />
        </div>
        <div class="field">
          <label>Caption</label>
          <input type="text" id="gCaption" placeholder="e.g. Lab orientation day" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/include.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
