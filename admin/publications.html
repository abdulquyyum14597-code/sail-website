<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications — SAIL Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
<script src="../js/theme.js"></script>
</head>
<body data-page="publications">
  <div class="admin-layout">
    <div data-include="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Publications</h1>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-secondary" onclick="exportCollection('publications')">Export JSON</button>
          <button class="btn btn-primary" onclick="openAddModal()">+ Add Publication</button>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Authors</th>
            <th>Year</th>
            <th>Venue</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="pubTableBody">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h2 id="modalTitle">Add Publication</h2>
      <form id="pubForm">
        <input type="hidden" id="pubId" />
        <div class="field">
          <label>Title <span class="required">*</span></label>
          <input type="text" id="pubTitle" required />
        </div>
        <div class="field">
          <label>Authors <span class="required">*</span></label>
          <input type="text" id="pubAuthors" placeholder="e.g. M. K. Shahzad, et al." required />
        </div>
        <div class="field">
          <label>Venue <span class="required">*</span></label>
          <input type="text" id="pubVenue" required />
        </div>
        <div class="field">
          <label>Year <span class="required">*</span></label>
          <input type="number" id="pubYear" required />
        </div>
        <div class="field">
          <label>Link (URL to paper)</label>
          <input type="text" id="pubLink" placeholder="https://..." />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/include.js"></script>
  <script src="js/publications.js"></script>
</body>
</html>
