<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — SAIL Smart AI Lab</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="gallery">

  <div data-include="header"></div>

  <section class="hero" style="padding:60px 24px;">
    <h1>Gallery</h1>
    <p>Photos from the lab, events, and activities.</p>
  </section>

  <section class="section">
    <div class="container">
      <div class="card-grid" id="galleryGrid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));">
        <p class="loading-text">Loading gallery...</p>
      </div>
    </div>
  </section>

  <div data-include="footer"></div>

  <script src="js/include.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
